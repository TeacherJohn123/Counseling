<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生長期輔導紀錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-8">
    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-2xl p-6 sm:p-8 border border-slate-100">
        
        <!-- 頁首與雲端狀態 -->
        <header class="border-b pb-4 mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-700 flex items-center gap-2">
                    🌱 學生長期輔導紀錄系統
                </h1>
                <p class="text-sm text-slate-500 mt-1">多選分發・自訂標籤・歷史編輯・雲端同步</p>
            </div>
            <div id="syncStatus" class="text-xs bg-amber-50 text-amber-700 px-3 py-1.5 rounded-full border border-amber-200 self-start sm:self-auto transition-colors">
                🔄 正在連線雲端同步...
            </div>
        </header>

        <!-- 記錄填寫表單 -->
        <form id="counselingForm" class="space-y-6">
            
            <!-- 學生編號網格 (1-29) -->
            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-sm font-semibold text-slate-700">學生編號（可複選）</label>
                    <button type="button" onclick="clearStudents()" class="text-xs text-blue-600 hover:text-blue-800">清除選取</button>
                </div>
                <div id="studentGrid" class="grid grid-cols-5 sm:grid-cols-8 gap-2">
                    <!-- JS 動態生成 -->
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">事發日期</label>
                    <input type="date" id="incidentDate" required 
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-700">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">系統建檔時間</label>
                    <input type="text" id="recordTime" readonly 
                        class="w-full border border-slate-200 bg-slate-100 rounded-lg px-3 py-2 text-slate-500 cursor-not-allowed text-sm">
                </div>
            </div>

            <!-- 事發地點標籤 -->
            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-sm font-semibold text-slate-700">事發地點（可複選）</label>
                    <button type="button" onclick="toggleEditLocation()" id="editLocBtn" class="text-xs text-slate-500 hover:text-red-600">編輯標籤</button>
                </div>
                <div class="flex flex-wrap gap-2 mb-2" id="locationContainer">
                    <!-- JS 動態生成 -->
                </div>
                <div class="flex gap-2 mt-2">
                    <input type="text" id="newLocation" placeholder="新增自訂地點..." 
                        class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="button" onclick="addLocation()" 
                        class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-sm transition">
                        ＋新增
                    </button>
                </div>
            </div>

            <!-- 相關人員 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">事件相關人員（非必填）</label>
                <input type="text" id="involvedPersons" placeholder="例如：外班學生姓名、科任老師、家長..." 
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">輔導與觀察紀錄</label>
                <textarea id="content" rows="4" required placeholder="請輸入本次事件經過與輔導紀錄..."
                    class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>

            <div class="flex justify-end pt-4 border-t">
                <button type="submit" id="submitBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium transition shadow-sm w-full sm:w-auto">
                    💾 儲存並分發至所選學生
                </button>
            </div>
        </form>

        <!-- 期末彙整與檢視區 -->
        <section class="mt-12 pt-6 border-t border-slate-200">
            <h2 class="text-lg font-bold text-slate-700 mb-3">📂 歷史紀錄管理與彙整</h2>
            
            <div class="flex flex-col sm:flex-row gap-2 mb-4">
                <input type="text" id="searchId" placeholder="輸入查詢座號 (例如: 01, 15)" 
                    class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="button" onclick="loadSummary()" id="searchBtn"
                    class="bg-slate-700 hover:bg-slate-800 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
                    載入該生紀錄
                </button>
                <button type="button" onclick="exportAllText()"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition flex items-center justify-center gap-1">
                    📄 一鍵複製全班總表
                </button>
            </div>
            
            <div class="space-y-4">
                <div class="relative">
                    <div id="summaryResult" class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm text-slate-700 min-h-[120px]">
                        尚無資料，請輸入座號並點擊載入。
                    </div>
                    <button type="button" onclick="copySummary()" id="copyBtn" class="hidden absolute top-3 right-3 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs px-2.5 py-1.5 rounded shadow-sm transition z-10">
                        📋 複製單人彙整
                    </button>
                </div>
            </div>
        </section>
    </div>

    <script>
        // 🔴 請確保此處為您的 Google Apps Script 網頁應用程式網址
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz06hdvkSh-p3vwP0AdFSoUqUJnXIgFHgziXsy-hpww7cd-fdQKiW6Wi0S_9Ju5hE2o/exec';

        let cloudData = {};
        let selectedStudents = new Set();
        let selectedLocations = new Set();
        let isEditingLocation = false;
        
        let locations = JSON.parse(localStorage.getItem('custom_locations')) || ['教室', '操場', '走廊', '科任教室', '學務處'];

        window.addEventListener('DOMContentLoaded', async function() {
            initTime();
            initStudentGrid();
            renderLocations();
            
            const statusEl = document.getElementById('syncStatus');
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();
                if (result.success) {
                    cloudData = result.data || {};
                    statusEl.className = 'text-xs bg-green-50 text-green-700 px-3 py-1.5 rounded-full border border-green-200 self-start sm:self-auto';
                    statusEl.innerText = '✅ 雲端同步就緒';
                } else throw new Error();
            } catch (err) {
                statusEl.className = 'text-xs bg-red-50 text-red-700 px-3 py-1.5 rounded-full border border-red-200 self-start sm:self-auto';
                statusEl.innerText = '⚠️ 雲端連線失敗，將使用離線模式';
                cloudData = JSON.parse(localStorage.getItem('counseling_fallback') || '{}');
            }
        });

        function initTime() {
            const now = new Date();
            document.getElementById('incidentDate').value = now.toISOString().split('T')[0];
            const formatted = now.getFullYear() + '/' + 
                String(now.getMonth() + 1).padStart(2, '0') + '/' + 
                String(now.getDate()).padStart(2, '0') + ' ' + 
                String(now.getHours()).padStart(2, '0') + ':' + 
                String(now.getMinutes()).padStart(2, '0');
            document.getElementById('recordTime').value = formatted;
        }

        function initStudentGrid() {
            const grid = document.getElementById('studentGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 29; i++) {
                const id = String(i).padStart(2, '0');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.innerText = id;
                btn.className = 'py-2 rounded-lg text-sm font-semibold border transition ' + 
                                'bg-white border-slate-200 text-slate-600 hover:bg-slate-50';
                btn.onclick = () => toggleStudent(id, btn);
                grid.appendChild(btn);
            }
        }

        function toggleStudent(id, btn) {
            if (selectedStudents.has(id)) {
                selectedStudents.delete(id);
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
            } else {
                selectedStudents.add(id);
                btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
                btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
            }
        }

        function clearStudents() {
            selectedStudents.clear();
            initStudentGrid();
        }

        function renderLocations() {
            const container = document.getElementById('locationContainer');
            container.innerHTML = '';
            locations.forEach((loc, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'relative flex items-center';

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.innerText = loc;
                
                const isSelected = selectedLocations.has(loc);
                btn.className = `px-3 py-1.5 rounded-full text-sm border transition ${isSelected ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`;
                
                btn.onclick = () => {
                    if (isEditingLocation) return;
                    if (selectedLocations.has(loc)) selectedLocations.delete(loc);
                    else selectedLocations.add(loc);
                    renderLocations();
                };

                wrapper.appendChild(btn);

                if (isEditingLocation) {
                    btn.classList.add('pr-8', 'opacity-70');
                    const delBtn = document.createElement('button');
                    delBtn.type = 'button';
                    delBtn.innerHTML = '×';
                    delBtn.className = 'absolute right-1 top-1/2 -translate-y-1/2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs hover:bg-red-600';
                    delBtn.onclick = () => {
                        selectedLocations.delete(loc);
                        locations.splice(index, 1);
                        renderLocations();
                    };
                    wrapper.appendChild(delBtn);
                }
                container.appendChild(wrapper);
            });
            localStorage.setItem('custom_locations', JSON.stringify(locations));
        }

        function addLocation() {
            const input = document.getElementById('newLocation');
            const val = input.value.trim();
            if (val && !locations.includes(val)) {
                locations.push(val);
                selectedLocations.add(val);
                input.value = '';
                renderLocations();
            }
        }

        function toggleEditLocation() {
            isEditingLocation = !isEditingLocation;
            const btn = document.getElementById('editLocBtn');
            btn.innerText = isEditingLocation ? '完成編輯' : '編輯標籤';
            btn.className = isEditingLocation ? 'text-xs text-green-600 font-bold' : 'text-xs text-slate-500 hover:text-red-600';
            renderLocations();
        }

        // 共用雲端同步函數
        async function syncToCloud() {
            localStorage.setItem('counseling_fallback', JSON.stringify(cloudData));
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = '🔄 正在同步中...';
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cloudData)
                });
                statusEl.className = 'text-xs bg-green-50 text-green-700 px-3 py-1.5 rounded-full border border-green-200 self-start sm:self-auto';
                statusEl.innerText = '✅ 雲端同步完成';
            } catch (error) {
                statusEl.className = 'text-xs bg-red-50 text-red-700 px-3 py-1.5 rounded-full border border-red-200 self-start sm:self-auto';
                statusEl.innerText = '⚠️ 雲端連線失敗，已存於本機';
            }
        }

        document.getElementById('counselingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (selectedStudents.size === 0) return alert('請至少選擇一位學生！');

            const incidentDate = document.getElementById('incidentDate').value;
            const recordTime = document.getElementById('recordTime').value;
            const involved = document.getElementById('involvedPersons').value.trim();
            const rawText = document.getElementById('content').value.trim();
            const locs = Array.from(selectedLocations).join('、');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '正在處理中...';

            let finalContent = `【事發日期】${incidentDate}\n`;
            finalContent += `【事發地點】${locs || '未註記'}\n`;
            if (involved) finalContent += `【相關人員】${involved}\n`;
            finalContent += `【內容紀錄】${rawText}`;

            selectedStudents.forEach(studentId => {
                if (!cloudData[studentId]) cloudData[studentId] = [];
                cloudData[studentId].push({ time: recordTime, content: finalContent });
            });

            await syncToCloud();
            alert(`✅ 儲存成功！\n已將紀錄分發給：${Array.from(selectedStudents).join(', ')}`);
            
            clearStudents();
            selectedLocations.clear();
            renderLocations();
            document.getElementById('involvedPersons').value = '';
            document.getElementById('content').value = '';
            initTime();
            
            submitBtn.disabled = false;
            submitBtn.innerText = '💾 儲存並分發至所選學生';
        });

        // 載入紀錄與產出編輯介面
        function loadSummary() {
            let searchId = document.getElementById('searchId').value.trim();
            if (searchId.length === 1) searchId = '0' + searchId;
            
            const resultBox = document.getElementById('summaryResult');
            const copyBtn = document.getElementById('copyBtn');

            if (!searchId) return alert('請輸入座號');

            const studentRecords = cloudData[searchId];
            if (!studentRecords || studentRecords.length === 0) {
                resultBox.innerHTML = `找不到座號 [ ${searchId} ] 的輔導紀錄。`;
                copyBtn.classList.add('hidden');
                return;
            }

            let htmlContent = `<div class="font-bold text-slate-700 mb-4 pb-2 border-b border-slate-200">--- 座號 [ ${searchId} ] 紀錄彙整 ---</div>`;
            
            studentRecords.forEach((item, index) => {
                htmlContent += `
                <div class="mb-4 p-4 bg-white border border-slate-200 rounded-xl relative group shadow-sm" id="record-${index}">
                    <div class="text-xs text-slate-400 mb-2 flex justify-between items-center">
                        <span>📝 紀錄 ${index + 1} (建檔: ${item.time})</span>
                        <div class="opacity-0 group-hover:opacity-100 transition flex gap-3">
                            <button onclick="editRecord('${searchId}', ${index})" class="text-blue-500 hover:text-blue-700 flex items-center gap-1"><span class="text-sm">✏️</span>編輯</button>
                            <button onclick="deleteRecord('${searchId}', ${index})" class="text-red-500 hover:text-red-700 flex items-center gap-1"><span class="text-sm">🗑️</span>刪除</button>
                        </div>
                    </div>
                    <div class="text-slate-700 whitespace-pre-line text-sm leading-relaxed" id="content-${index}">${item.content}</div>
                </div>`;
            });

            resultBox.innerHTML = htmlContent;
            copyBtn.classList.remove('hidden');
        }

        // 開啟編輯模式
        function editRecord(studentId, index) {
            const container = document.getElementById(`record-${index}`);
            const currentContent = cloudData[studentId][index].content;
            
            container.innerHTML = `
                <div class="text-xs text-slate-500 mb-2 font-bold text-blue-600">✏️ 正在編輯紀錄 ${index + 1}</div>
                <textarea id="edit-input-${index}" class="w-full border border-blue-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" rows="6">${currentContent}</textarea>
                <div class="mt-3 flex justify-end gap-2">
                    <button onclick="loadSummary()" class="text-xs px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded transition">取消</button>
                    <button onclick="saveRecord('${studentId}', ${index})" class="text-xs px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded shadow-sm transition">💾 儲存修改</button>
                </div>
            `;
        }

        // 儲存編輯結果
        async function saveRecord(studentId, index) {
            const newContent = document.getElementById(`edit-input-${index}`).value.trim();
            if(!newContent) return alert('內容不能為空！');
            
            cloudData[studentId][index].content = newContent;
            await syncToCloud();
            loadSummary(); // 重新載入畫面
        }

        // 刪除該筆紀錄
        async function deleteRecord(studentId, index) {
            if(confirm('確定要永久刪除這筆紀錄嗎？此操作無法復原。')) {
                cloudData[studentId].splice(index, 1);
                await syncToCloud();
                loadSummary(); // 重新載入畫面
            }
        }

        // 複製單一學生彙整
        function copySummary() {
            let searchId = document.getElementById('searchId').value.trim();
            if (searchId.length === 1) searchId = '0' + searchId;
            const records = cloudData[searchId];
            if(!records) return;
            
            let summaryText = `--- 座號 [ ${searchId} ] 紀錄彙整 ---\n\n`;
            records.forEach((item, index) => {
                summaryText += `📝 紀錄 ${index + 1} (建檔時間: ${item.time})\n${item.content}\n\n`;
            });
            
            navigator.clipboard.writeText(summaryText.trim()).then(() => alert('✨ 已成功複製單人彙整紀錄！'));
        }

        // 一鍵複製全班 1~29 號純文字總表
        function exportAllText() {
            let fullText = "====== 全班輔導紀錄總表 ======\n\n";
            
            for (let i = 1; i <= 29; i++) {
                const id = String(i).padStart(2, '0');
                const records = cloudData[id];
                
                fullText += `========================================\n`;
                if (records && records.length > 0) {
                    fullText += `【座號 ${id}】輔導紀錄彙整（共 ${records.length} 筆）\n`;
                    fullText += `========================================\n`;
                    records.forEach((item, index) => {
                        fullText += `📝 紀錄 ${index + 1} (建檔時間: ${item.time})\n${item.content}\n\n`;
                    });
                } else {
                    fullText += `【座號 ${id}】輔導紀錄彙整\n`;
                    fullText += `========================================\n`;
                    fullText += `（本學期無輔導紀錄）\n\n`;
                }
            }
            
            navigator.clipboard.writeText(fullText.trim()).then(() => {
                alert('✨ 已成功複製全班 29 位學生的純文字總表！\n您可以直接貼上至 Word 或記事本中。');
            }).catch(() => {
                alert('複製失敗，請檢查瀏覽器權限設定。');
            });
        }
    </script>
</body>
</html>
